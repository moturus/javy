[package]
name = "motor-javy-tests"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
anyhow = "1"
javy-motor-engine = { path = "../crates/motor-engine" }
wasmi = { version = "=1.1.0", default-features = false, features = ["std", "simd", "wat"] }
[target.'cfg(target_os = "motor")'.dependencies]
moto-sys = { git = "https://github.com/moturus/motor-os", branch = "main" }
motor-javy-cxx-tls = { path = "../crates/motor-cxx-tls" }
[patch.crates-io]
wasmi = { git = "https://github.com/moturus/wasmi", branch = "motor-1.1.0" }
wasmi_core = { git = "https://github.com/moturus/wasmi", branch = "motor-1.1.0" }
wasmi_ir = { git = "https://github.com/moturus/wasmi", branch = "motor-1.1.0" }
wasmtime-wizer = { git = "https://github.com/moturus/wasmtime", branch = "motor-48.0.1" }
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
