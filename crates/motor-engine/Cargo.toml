[package]
name = "javy-motor-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
[dependencies]
anyhow = "1"
rand_core = "=0.10.1"
rand_pcg = "=0.10.2"
wasmi = { version = "=1.1.0", default-features = false, features = ["std", "simd"] }
wasmtime-wizer = { path = "../../../wasmtime/crates/wizer", default-features = false }
[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = { path = "../../../motor-os/src/sys/lib/moto-rt" }
moto-sys = { path = "../../../motor-os/src/sys/lib/moto-sys" }
[target.'cfg(not(target_os = "motor"))'.dependencies]
getrandom = "0.3"
[[bin]]
name = "wasmi"
path = "src/main.rs"
