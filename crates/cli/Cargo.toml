[package]
name = "javy-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
build = "build.rs"
[[bin]]
name = "javy"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
walrus.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
javy-codegen = { path = "../codegen", features = ["plugin_internal"] }
javy-plugin-processing = { path = "../plugin-processing" }
javy-motor-engine = { path = "../motor-engine" }

[target.'cfg(target_os = "motor")'.dependencies]
motor-javy-cxx-tls = { path = "../motor-cxx-tls" }

[dev-dependencies]
brotli = { workspace = true }
javy-runner = { path = "../runner" }
javy-test-macros = { path = "../test-macros" }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wit-component = "0.258.0"
tokio = { workspace = true, features = ["macros"] }
